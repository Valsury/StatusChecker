<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a0010" />
  <link rel="manifest" href="manifest.json" />
  <title>💋 O-Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <header>
      <div class="header-icon">💋</div>
      <h1>O·Tracker</h1>
      <p class="subtitle">твой личный дневник удовольствий</p>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">—</span>
        <span class="stat-label">всего раз</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-avg">—</span>
        <span class="stat-label">средняя оценка</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-best">—</span>
        <span class="stat-label">лучшая оценка</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-last">—</span>
        <span class="stat-label">последний раз</span>
      </div>
    </div>

    <!-- Dry spell counter -->
    <div class="dry-spell-card" id="dry-spell-card" style="display:none">
      <span class="dry-spell-icon" id="dry-spell-icon">🌵</span>
      <div class="dry-spell-info">
        <span class="dry-spell-days" id="dry-spell-days"></span>
        <span class="dry-spell-label" id="dry-spell-label"></span>
      </div>
    </div>

    <!-- Achievements -->
    <div class="card achievements-card" id="achievements-section" style="display:none">
      <h2><span class="accent">🏆</span> достижения</h2>
      <div class="achievements-grid" id="achievements-grid"></div>
    </div>

    <!-- Analytics -->
    <div class="card analytics-card" id="analytics-section" style="display:none">
      <h2><span class="accent">📊</span> аналитика</h2>

      <div class="streak-banner" id="streak-banner" style="display:none">
        <span class="streak-fire">🔥</span>
        <span id="streak-text"></span>
      </div>

      <div class="analytics-block">
        <div class="analytics-label">активность по месяцам</div>
        <canvas id="chart-months" height="120"></canvas>
      </div>

      <div class="analytics-row">
        <div class="analytics-block half">
          <div class="analytics-label">оценки</div>
          <canvas id="chart-ratings" height="100"></canvas>
        </div>
        <div class="analytics-block half">
          <div class="analytics-label">дни недели</div>
          <canvas id="chart-weekdays" height="100"></canvas>
        </div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="card calendar-card">
      <div class="calendar-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <h2 id="cal-title" class="cal-title"></h2>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <!-- Day popup -->
    <div class="day-popup" id="day-popup" style="display:none">
      <div class="day-popup-inner">
        <div class="day-popup-date" id="popup-date"></div>
        <div class="day-popup-records" id="popup-records"></div>
        <button class="btn-primary" id="popup-add-btn">+ добавить запись на этот день</button>
        <button class="btn-close" id="popup-close">✕</button>
      </div>
    </div>

    <!-- Form -->
    <div class="card form-card">
      <h2><span class="accent">+</span> новая запись</h2>
      <form id="record-form">
        <div class="form-group">
          <label for="date">дата</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label>оценка: <span id="rating-display" class="accent">5</span> / 10</label>
          <div class="rating-slider">
            <input type="range" id="rating" min="1" max="10" value="5" />
            <div class="rating-emojis">
              <span>😐</span><span>🥵</span><span>😈</span><span>🔥</span><span>💦</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="note">заметка <span class="muted">(необязательно)</span></label>
          <textarea id="note" placeholder="расскажи как это было..." rows="2"></textarea>
        </div>

        <!-- Tags -->
        <div class="form-group">
          <label>теги</label>
          <div class="tags-grid">
            <button type="button" class="tag-btn" data-tag="соло">🤍 соло</button>
            <button type="button" class="tag-btn" data-tag="с партнёром">👫 с партнёром</button>
            <button type="button" class="tag-btn" data-tag="quickie">⚡ quickie</button>
            <button type="button" class="tag-btn" data-tag="долго">🕯️ долго</button>
            <button type="button" class="tag-btn" data-tag="игрушки">🎀 игрушки</button>
            <button type="button" class="tag-btn" data-tag="спонтанно">💥 спонтанно</button>
          </div>
        </div>

        <!-- Mood -->
        <div class="form-row">
          <div class="form-group half">
            <label>настроение до: <span id="mood-before-display" class="accent">—</span></label>
            <div class="mood-picker" id="mood-before-picker">
              <button type="button" class="mood-btn" data-target="mood_before" data-val="1">😔</button>
              <button type="button" class="mood-btn" data-target="mood_before" data-val="2">😐</button>
              <button type="button" class="mood-btn" data-target="mood_before" data-val="3">🙂</button>
              <button type="button" class="mood-btn" data-target="mood_before" data-val="4">😊</button>
              <button type="button" class="mood-btn" data-target="mood_before" data-val="5">🥰</button>
            </div>
            <input type="hidden" id="mood_before" value="" />
          </div>
          <div class="form-group half">
            <label>настроение после: <span id="mood-after-display" class="accent">—</span></label>
            <div class="mood-picker" id="mood-after-picker">
              <button type="button" class="mood-btn" data-target="mood_after" data-val="1">😔</button>
              <button type="button" class="mood-btn" data-target="mood_after" data-val="2">😐</button>
              <button type="button" class="mood-btn" data-target="mood_after" data-val="3">🙂</button>
              <button type="button" class="mood-btn" data-target="mood_after" data-val="4">😊</button>
              <button type="button" class="mood-btn" data-target="mood_after" data-val="5">🥰</button>
            </div>
            <input type="hidden" id="mood_after" value="" />
          </div>
        </div>

        <!-- Duration -->
        <div class="form-group">
          <label for="duration_min">продолжительность <span class="muted">(минут, необязательно)</span></label>
          <input type="number" id="duration_min" min="1" max="999" placeholder="например, 30" />
        </div>

        <button type="submit" class="btn-primary">сохранить 🔥</button>
      </form>
    </div>

    <!-- Records list -->
    <section class="records-section">
      <h2><span class="accent">♥</span> история</h2>
      <div id="records-list"></div>
    </section>
    <!-- Compliment popup -->
    <div class="compliment-popup" id="compliment-popup" style="display:none">
      <div class="compliment-inner">
        <div class="compliment-emoji" id="compliment-emoji"></div>
        <div class="compliment-text" id="compliment-text"></div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
